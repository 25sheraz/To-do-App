<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A minimal, elegant Todo app — add, check off, and manage your tasks." />
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <div class="header-glow"></div>
      <h1 class="app-title">
        <span class="title-icon">✦</span>
        My Tasks
      </h1>
      <p class="app-subtitle">Stay focused, stay productive.</p>
    </header>

    <main class="app-main">
      <!-- Add Todo Form (SHE-5) -->
      <form id="todo-form" class="add-form" novalidate>
        <div class="input-wrapper">
          <span class="input-icon">＋</span>
          <input
            id="todo-input"
            type="text"
            class="todo-input"
            placeholder="Add a new task…"
            autocomplete="off"
            aria-label="New todo text"
          />
        </div>
        <button id="add-btn" type="submit" class="add-btn" aria-label="Add todo">
          Add
        </button>
      </form>

      <!-- Todo List -->
      <section class="list-section" aria-label="Todo list">
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">No tasks yet — add one above!</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
