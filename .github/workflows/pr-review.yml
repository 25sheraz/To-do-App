name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  review:
    name: Automated ESLint Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint and capture output
        id: eslint
        run: |
          set +e
          npx eslint "app.js" "tests/**/*.js" --format stylish 2>&1 | tee eslint_report.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.eslint.outputs.exit_code }}';
            let report = '';
            try {
              report = fs.readFileSync('eslint_report.txt', 'utf8').trim();
            } catch (e) {
              report = '(could not read ESLint output)';
            }

            const passed = exitCode === '0';
            const header = passed
              ? '## ✅ Automated Code Review — ESLint\n\nNo issues found. Code looks clean!'
              : '## ❌ Automated Code Review — ESLint\n\nIssues were found. Please address them before merging.';

            const body = passed
              ? `${header}\n\n> Checked: \`app.js\`, \`tests/**/*.js\``
              : `${header}\n\n\`\`\`\n${report}\n\`\`\``;

            // Delete previous bot review comments to avoid clutter
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('Automated Code Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
